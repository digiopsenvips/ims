<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Enactus IMS</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        max-width: 540px;
        width: min(90vw, 540px);
        border-radius: 20px;
        background: white;
        box-shadow: 0 25px 50px rgba(15, 23, 42, 0.08);
        padding: 32px;
        text-align: center;
      }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.5rem); }
      p { margin: 0; color: #475569; line-height: 1.6; }
      .badge {
        display: inline-block;
        margin-bottom: 16px;
        background: #dbeafe;
        color: #1d4ed8;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Offline</div>
      <h1>Connection lost</h1>
      <p>Your sales entries are safely queued in the browser and will sync automatically when network access returns.</p>
    </main>
  </body>
</html>
